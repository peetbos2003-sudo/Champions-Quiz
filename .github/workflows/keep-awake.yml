name: Keep Supabase awake

on:
  schedule:
    - cron: "17 7 */3 * *"   # every 3 days, 07:17 UTC
  workflow_dispatch:          # "Run workflow" button for a manual wake-up

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the quiz database
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "https://lgeqzsdurewtjvqticho.supabase.co/rest/v1/rpc/server_time" \
            -H "apikey: sb_publishable_vQxOpKXbaaRzGy-l8yen0g_zAB3ithw" \
            -H "Content-Type: application/json" -d '{}'
          echo
          curl -sS --fail-with-body \
            "https://lgeqzsdurewtjvqticho.supabase.co/rest/v1/game_state?select=phase,question_count" \
            -H "apikey: sb_publishable_vQxOpKXbaaRzGy-l8yen0g_zAB3ithw"
